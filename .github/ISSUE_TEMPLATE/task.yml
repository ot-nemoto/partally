name: 作業依頼
description: 機能追加・修正などの作業。種類を選び、概要・作業内容・確認内容を必ず書く
body:
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      description: 選んだ種類のラベルを、作った後に issue-kind-label.yml が Issue に付ける。enhancement のときだけリリースが minor になる
      options:
        - "bug：不具合の修正（テスト・CI の不具合の修正を含む）"
        - "enhancement：機能の追加・変更"
        - "documentation：資料だけの変更"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何のために、何をするか
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 作業内容
      description: 変更する内容と方針
      placeholder: "- "
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 確認内容
      description: 何を、どうやって確かめるか（テスト・lint・型チェック・ブラウザでの動作確認など）
      placeholder: "- "
    validations:
      required: true
