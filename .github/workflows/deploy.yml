name: Deploy

# 手動実行のみ（Actions タブの「Run workflow」から）
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC で AWS のロールを引き受けるため
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-northeast-1
      PARTALLY_ADMIN_PASSWORD: ${{ secrets.PARTALLY_ADMIN_PASSWORD }}
      PARTALLY_BUDGET_EMAIL: ${{ secrets.PARTALLY_BUDGET_EMAIL }}
      PARTALLY_BUDGET_USD: ${{ vars.PARTALLY_BUDGET_USD }}
    steps:
      # 設定漏れは時間のかかるインストール・テストの前に止める
      - name: Check AWS_ROLE_ARN secret
        env:
          HAS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          if [ "$HAS_ROLE_ARN" != "true" ]; then
            echo "::error::production の Environment secrets に AWS_ROLE_ARN を登録してください（Variables ではログにアカウント ID が出るため使いません）"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npx -y npm@11 ci

      # lint・整形は CI（ci.yml）で確認済みのため、デプロイでは動作に関わる型チェックとテストだけを行う
      - name: Test
        run: |
          npm run typecheck
          npm test

      - name: Build web
        run: npm run build

      # 公開リポジトリの Actions ログにアカウント ID を出さない。
      # ロール ARN は Secret から読んで伏せ（変数だとステップの見出しにそのまま出る）、
      # 認証後はアカウント ID 自体を伏せる（アセット名やスタック ARN に含まれる）
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy
        run: npm run cdk -w infra -- deploy --require-approval never
