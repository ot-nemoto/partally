name: CI

# develop 宛ての PR と develop への push で、lint・型チェック・テスト・ビルドと E2E テストを行う。
# develop への push（PR のマージ）と手動実行（develop を選んだとき）は、続けて本番へデプロイする
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

# PR は PR ごとのグループで、新しい push が来たら古い実行を取り消す。
# push と手動実行の確認は取り消さず、コミットごとに結果を残す（デプロイの順番は deploy ジョブで制御する）
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npx -y npm@11 ci

      - name: Lint
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build

  # 画面を通した E2E テスト（docs/e2e-tests.md の P0）。ローカル開発環境（メモリ内の API と web）を起動して実行する
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npx -y npm@11 ci

      - name: Install browser
        run: npx playwright install --with-deps chromium webkit
        working-directory: e2e

      - name: E2E
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  deploy:
    needs: [check, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: production
    # デプロイは 1 つずつ行う（CloudFormation は同時の更新を待たずに失敗させる）。
    # 待っているデプロイは新しいものに置き換わるが、新しい方は古いコミットも含むので問題ない
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC で AWS のロールを引き受けるため（デプロイのジョブだけに与える）
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      PARTALLY_BUDGET_EMAIL: ${{ secrets.PARTALLY_BUDGET_EMAIL }}
      PARTALLY_BUDGET_USD: ${{ vars.PARTALLY_BUDGET_USD }}
    steps:
      # 設定漏れは時間のかかるインストールの前に止める
      - name: Check secrets
        env:
          HAS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAS_ADMIN_PASSWORD: ${{ secrets.PARTALLY_ADMIN_PASSWORD != '' }}
        run: |
          if [ "$HAS_ROLE_ARN" != "true" ]; then
            echo "::error::production の Environment secrets に AWS_ROLE_ARN を登録してください（Variables ではログにアカウント ID が出るため使いません）"
            exit 1
          fi
          if [ "$HAS_ADMIN_PASSWORD" != "true" ]; then
            echo "::error::production の Environment secrets に PARTALLY_ADMIN_PASSWORD を登録してください"
            exit 1
          fi

      - uses: actions/checkout@v7

      # テストの終わる順でデプロイが前後すると、古いコードが後から反映される。
      # develop に後から入ったコミットがあれば、その実行に任せてデプロイしない。
      # ただし bump-version.yml のコミット（github-actions[bot]）は CI が動かないので数えない
      - name: Check latest commit
        id: latest
        run: |
          git fetch --quiet origin develop
          NEWER=$(git log "$GITHUB_SHA..FETCH_HEAD" --format=%an | grep -cvx 'github-actions\[bot\]' || true)
          if [ "$NEWER" = "0" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::develop に新しいコミットがあるため、このコミットのデプロイは省略しました（新しい実行がデプロイします）"
          fi

      - uses: actions/setup-node@v7
        if: steps.latest.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.latest.outputs.deploy == 'true'
        run: npx -y npm@11 ci

      # lint・型チェック・テストは check ジョブで済んでいるので、ここでは画面のビルドだけを行う
      - name: Build web
        if: steps.latest.outputs.deploy == 'true'
        run: npm run build

      # 公開リポジトリの Actions ログに、アカウント ID や本番の URL・リソース名を出さない。
      # ロール ARN は Secret から読んで伏せ（変数だとステップの見出しにそのまま出る）、
      # 認証は自前の action で行う（configure-aws-credentials はアカウント ID を割り出せるロールの ID を出すため）
      - uses: ./.github/actions/aws-oidc
        if: steps.latest.outputs.deploy == 'true'
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      # 管理者パスワードを、GitHub の Secret から SSM の暗号化パラメータに書き込む（テンプレートと Lambda の環境変数には入れない。
      # API の Lambda が SSM から読む）。パラメータ名は infra/cdk.json の context adminPasswordParam。
      # 値はコマンドの引数に置かず、自分だけが読める一時ファイルの JSON で渡す
      - name: Store admin password
        if: steps.latest.outputs.deploy == 'true'
        env:
          PARTALLY_ADMIN_PASSWORD: ${{ secrets.PARTALLY_ADMIN_PASSWORD }}
        run: |
          PARAM=$(jq -r '.context.adminPasswordParam' infra/cdk.json)
          INPUT="$RUNNER_TEMP/admin-password.json"
          trap 'rm -f "$INPUT"' EXIT
          (umask 077 && jq -n --arg name "$PARAM" --arg value "$PARTALLY_ADMIN_PASSWORD" \
            '{Name: $name, Type: "SecureString", Overwrite: true, Value: $value}' > "$INPUT")
          if ! aws ssm put-parameter --cli-input-json "file://$INPUT" > /dev/null; then
            echo "::error::管理者パスワードを SSM に書き込めませんでした。GitHub Actions のロール（partally-github-oidc スタック）を最新のテンプレートで更新してください（docs/setup.md）"
            exit 1
          fi
          echo "管理者パスワードを SSM に書き込みました"

      # 今のスタックの Outputs（URL・バケット名・テーブル名）とスタック ID を伏せる。
      # デプロイのエラーのメッセージに出たときのため。URL はドメインごと伏せる（/admin 付きも伏せる）。
      # 初回はスタックが無いので何もしない
      - name: Mask stack outputs
        if: steps.latest.outputs.deploy == 'true'
        run: |
          STACK=$(aws cloudformation describe-stacks --stack-name Partally --output json 2>/dev/null || true)
          [ -n "$STACK" ] || exit 0
          jq -r '.Stacks[0].StackId, (.Stacks[0].Outputs // [] | .[].OutputValue)' <<<"$STACK" | while IFS= read -r v; do
            [ -n "$v" ] || continue
            echo "::add-mask::$v"
            case "$v" in https://*) host=${v#https://}; echo "::add-mask::${host%%/*}" ;; esac
          done

      # CDK が最後に出す Outputs と Stack ARN は表示しない（初回など、まだ伏せていない値があるときのため）。
      # URL は、ジョブのまとめのリンクから CloudFormation の Outputs で確かめる
      - name: Deploy
        if: steps.latest.outputs.deploy == 'true'
        run: |
          set -o pipefail
          npm run cdk -w infra -- deploy --require-approval never 2>&1 \
            | awk '/^Outputs:/ { skip = 1 } /Total time/ { skip = 0 } !skip { print; fflush() }'

      - name: Link to stack outputs
        if: steps.latest.outputs.deploy == 'true'
        run: |
          CONSOLE="https://${AWS_REGION}.console.aws.amazon.com/cloudformation/home?region=${AWS_REGION}"
          {
            echo "### デプロイ先"
            echo
            echo "URL は公開のログに出していません。AWS にログインして、CloudFormation のスタック Partally の Outputs で確かめてください。"
            echo
            echo "- [Partally の Outputs](${CONSOLE}#/stacks/outputs?stackId=Partally)"
            echo "- [スタックの一覧（Partally で絞り込み）](${CONSOLE}#/stacks?filteringText=Partally)"
          } >> "$GITHUB_STEP_SUMMARY"
