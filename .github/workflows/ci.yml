name: CI

# develop 宛ての PR と develop への push で、lint・型チェック・テスト・ビルドを行う。
# develop への push（PR のマージ）と手動実行（develop を選んだとき）は、続けて本番へデプロイする
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

# PR は PR ごとのグループで、新しい push が来たら古い実行を取り消す。
# develop への push と手動実行は 1 つのグループに並べ、取り消さずに順番に処理する
# （テストの終わる順でデプロイが前後して古いコードが後から反映されるのを防ぐ。
# CloudFormation は同時の更新を待たずに失敗させるため、取り消しではなく待ち行列にする）
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npx -y npm@11 ci

      - name: Lint
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC で AWS のロールを引き受けるため（デプロイのジョブだけに与える）
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      PARTALLY_ADMIN_PASSWORD: ${{ secrets.PARTALLY_ADMIN_PASSWORD }}
      PARTALLY_BUDGET_EMAIL: ${{ secrets.PARTALLY_BUDGET_EMAIL }}
      PARTALLY_BUDGET_USD: ${{ vars.PARTALLY_BUDGET_USD }}
    steps:
      # 設定漏れは時間のかかるインストールの前に止める
      - name: Check AWS_ROLE_ARN secret
        env:
          HAS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          if [ "$HAS_ROLE_ARN" != "true" ]; then
            echo "::error::production の Environment secrets に AWS_ROLE_ARN を登録してください（Variables ではログにアカウント ID が出るため使いません）"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npx -y npm@11 ci

      # lint・型チェック・テストは check ジョブで済んでいるので、ここでは画面のビルドだけを行う
      - name: Build web
        run: npm run build

      # 公開リポジトリの Actions ログにアカウント ID を出さない。
      # ロール ARN は Secret から読んで伏せ（変数だとステップの見出しにそのまま出る）、
      # 認証後はアカウント ID 自体を伏せる（アセット名やスタック ARN に含まれる）
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy
        run: npm run cdk -w infra -- deploy --require-approval never
