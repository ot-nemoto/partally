name: Reset

# 選んだ環境のデータ（参加者・QR・写真・お気に入り・クイズ・景品・スケジュール・設定）をすべて消して、デプロイ直後の状態に戻す。
# 手動実行のみ。選んだ Environment（develop / production）で動く。既定は develop。
# 確認欄に、develop なら「初期化」、本番（production）なら「本番を初期化」と入力しないと止まる（環境を取り違えて本番を消さないため）
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 初期化する環境（develop：develop 用のアカウント、production：本番）
        required: true
        type: choice
        options: [develop, production]
        default: develop
      confirm:
        description: 選んだ環境のデータをすべて消します（元に戻せません）。develop なら「初期化」、production なら「本番を初期化」と入力
        required: true
        type: string

# 二重に動かさない。デプロイとは別のグループにする（同じグループだと、待っている方が後から来た実行に取り消される）
concurrency:
  group: reset-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC で AWS のロールを引き受けるため
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ap-northeast-1
    steps:
      - name: Check confirmation
        env:
          TARGET: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
          HAS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          if [ "$TARGET" = "production" ]; then EXPECTED="本番を初期化"; else EXPECTED="初期化"; fi
          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "::error::${TARGET} を初期化するには、確認欄に「${EXPECTED}」と入力してください。何も消さずに終了しました"
            exit 1
          fi
          if [ "$HAS_ROLE_ARN" != "true" ]; then
            echo "::error::${TARGET} の Environment secrets に AWS_ROLE_ARN を登録してください"
            exit 1
          fi

      # 認証の action（.github/actions/aws-oidc）を使うために取り出す
      - uses: actions/checkout@v7

      # ログにアカウント ID を割り出せる値を出さないため、configure-aws-credentials ではなく自前の action で認証する
      - uses: ./.github/actions/aws-oidc
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      # 関数名は infra/lib/partally-stack.ts、合言葉は api/src/reset.ts の RESET_CONFIRMATION と同じ
      - name: Reset
        run: |
          aws lambda invoke \
            --function-name partally-reset \
            --cli-binary-format raw-in-base64-out \
            --payload '{"confirm":"delete-all-partally-data"}' \
            --cli-read-timeout 360 \
            result.json > response.json
          # 失敗時のエラーの詳細（写真のキーや ARN を含みうる）は公開ログに出さず、CloudWatch Logs で確かめる
          if jq -e '.FunctionError' response.json > /dev/null; then
            echo "::error::初期化に失敗しました（$(jq -r '.errorType // "Error"' result.json)）。もう一度実行すると残りを消せます。詳細は CloudWatch Logs の ResetLogs"
            exit 1
          fi
          echo "結果: $(jq -c '{items, objects}' result.json)"
